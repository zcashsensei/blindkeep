<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96"
     role="img" aria-label="Blindkeep">
  <title>Blindkeep</title>
  <!-- The wordmark is live <text> on a system stack, NOT outlined paths. That is fine
       for web and README use, where the stack resolves to something sane everywhere,
       and it keeps the file editable. It is NOT fine for print, embroidery, or handing
       to a third party: those need the glyphs converted to outlines first, or the mark
       renders in whatever the recipient happens to have installed. Convert before any
       use where you do not control the renderer. -->
  <g>
    <path d="M40 8 L72 19 v28 c0 19-13 32-32 40 C21 79 8 66 8 47 V19 Z"
          fill="none" stroke="#F4B728" stroke-width="4" stroke-linejoin="round"/>
    <path fill-rule="evenodd" fill="#F4B728"
          d="M25 44 h6 v-7 h6 v7 h6 v-7 h6 v7 h6 v26 H25 Z
             M36 57 h8 v13 h-8 Z"/>
  </g>
  <g transform="translate(96 0)">
    <text x="0" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="40" letter-spacing="6.5" fill="#8b949e" font-weight="400">BLIND</text>
    <text x="150" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="40" letter-spacing="6.5" fill="#F4B728" font-weight="700">KEEP</text>
  </g>
</svg>
