        fill="none" stroke="#F4B728" stroke-width="7" stroke-linejoin="round"/>
  <path fill-rule="evenodd" fill="#F4B728"
        d="M30 44 h7 v-8 h7 v8 h8 v-8 h7 v8 h7 v27 H30 Z
           M42 56 h12 v15 h-12 Z"/>
</svg>
