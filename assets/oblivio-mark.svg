<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Oblivio">
  <title>Oblivio</title>
  <!-- The door is knocked out with fill-rule="evenodd" rather than painted in the
       background colour, so the mark works on any ground: dark, light, print, or
       embroidered. A logo that assumes a backdrop is a logo with one placement. -->
  <path d="M48 8 L80 19 v28 c0 19-13 32-32 40 C29 79 16 66 16 47 V19 Z"
        fill="none" stroke="#F4B728" stroke-width="4" stroke-linejoin="round"/>
  <path fill-rule="evenodd" fill="#F4B728"
        d="M33 44 h6 v-7 h6 v7 h6 v-7 h6 v7 h6 v26 H33 Z
           M44 57 h8 v13 h-8 Z"/>
</svg>
