<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96"
     role="img" aria-label="Oblivio">
  <title>Oblivio</title>
  <!-- The inverse of the black-and-white proof: one ink, white, for a dark ground.
       Drawn rather than derived — inverting the gold lockup produces a muddy olive,
       and screening black produces grey.

       Paired with oblivio-wordmark-mono.svg through <picture> in the README so the
       wordmark reads on both GitHub themes. A single-ink mark needs both inks to be
       usable: black alone disappears on dark, white alone disappears on light, and
       shipping only one guarantees half the readers see nothing.

       Same caveat as the lockup: live <text>, so convert the glyphs to outlines
       before sending it anywhere you do not control the renderer. -->
  <text x="173.25" y="62" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" letter-spacing="6.5" fill="#FFFFFF" font-weight="700">OBLIVIO</text>
</svg>
