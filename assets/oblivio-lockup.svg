<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96"
     role="img" aria-label="Oblivio">
  <title>Oblivio</title>
  <!-- The wordmark is live <text> on a system stack, NOT outlined paths. That is fine
       for web and README use, where the stack resolves to something sane everywhere,
       and it keeps the file editable. It is NOT fine for print, embroidery, or handing
       to a third party: those need the glyphs converted to outlines first, or the mark
       renders in whatever the recipient happens to have installed. Convert before any
       use where you do not control the renderer. -->

  <!-- Wordmark alone. Centred with text-anchor rather than a computed x, because the
       font stack resolves differently per platform and a hardcoded offset would only
       be centred on the machine it was measured on.

       x is 170 (half of 340) plus half the letter-spacing: SVG adds the tracking after
       the final glyph as well, so the advance the renderer centres is 6.5px wider than
       the ink. Without the +3.25 the word sits visibly left of centre. -->
  <text x="173.25" y="62" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" letter-spacing="6.5" fill="#F4B728" font-weight="700">OBLIVIO</text>
</svg>
