<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96"
     role="img" aria-label="Oblivio">
  <title>Oblivio</title>
  <!-- Black-and-white proof of the wordmark. Same geometry as the primary lockup, one
       ink, no colour.

       This exists to answer a question the gold version cannot: does the mark still
       read when the colour is taken away? Colour is the first thing lost to a fax, a
       photocopier, a single-colour print run, an embroidery machine, or a partner's
       house style — and a mark that only works in its brand colour is a mark that
       stops working the moment somebody else handles it.

       Black on transparent, sized for a light ground. For a dark ground change the
       fill to #FFFFFF; do not screen or invert the gold version, which produces a
       muddy olive rather than a clean white.

       Same caveat as the lockup: this is live <text>, so convert the glyphs to
       outlines before sending it anywhere you do not control the renderer. -->
  <text x="173.25" y="62" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" letter-spacing="6.5" fill="#000000" font-weight="700">OBLIVIO</text>
</svg>
